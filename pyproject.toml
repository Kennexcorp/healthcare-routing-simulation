[project]
name = "artifact"
version = "0.1.0"
description = "healthcare-routing-simulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "ortools>=9.15.6755",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src` is the package itself, not a src-layout container, and it does not
# match the distribution name, so hatchling has to be told where to look.
# Installing the project is what puts `src` on the import path: without it,
# `from src.x import y` resolves only when the working directory happens to be
# the repository root.
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# Redundant once the project is installed, but harmless, and it keeps editors
# that resolve imports by inspecting the layout rather than the interpreter
# from flagging every `from src.x import y` as unresolved.
root = ["."]
